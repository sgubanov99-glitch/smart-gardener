  /* 2.68: Цыпа — маскот-агроном */
  #tsypa { position:fixed; right:16px; bottom:88px; z-index:46; display:flex; flex-direction:column; align-items:flex-end; gap:6px; cursor:pointer; max-width:260px; }
  .tsypa-bubble { background:var(--panel); border:1px solid rgba(138,155,110,.3); border-radius:14px 14px 4px 14px; padding:10px 12px; font-size:13px; line-height:1.4; color:var(--ink); box-shadow:var(--shadow-s); }

  @keyframes tsypa-bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  /* 2.106/2.107/2.108: Цыпа гуляет по экрану — 6 позиций классами, слева зеркально */

  /* 2.110: в левых позициях зеркалится и хвост пузыря */

  #tsypa.pos-0 { right:16px; bottom:96px; top:auto; left:auto; }
  #tsypa.pos-1 { right:16px; top:45%;  bottom:auto; left:auto; }
  #tsypa.pos-2 { right:16px; top:84px; bottom:auto; left:auto; }
  #tsypa.pos-3 { left:16px;  top:84px; bottom:auto; right:auto; }
  #tsypa.pos-4 { left:16px;  top:45%;  bottom:auto; right:auto; }
  #tsypa.pos-5 { left:16px;  bottom:96px; top:auto; right:auto; }

    .scheme-toolbar { gap:8px; }
    .scheme-toolbar label { flex:1 1 42%; font-size:12.5px; }
    .scheme-toolbar input, .scheme-toolbar select { width:100%; min-height:40px; }
    #sunDir { width:100%; }
    .palette { margin-left:0; width:100%; }
    .palette-right { margin-left:0; }
    .pal-btn { padding:10px 14px; min-height:40px; }
    .scheme-actions { flex-direction:column; align-items:stretch; gap:8px; }
    /* 2.118: место под маркер солнца — не обрезается экраном */
    .plot-wrap { padding:26px 22px 22px; }
    .obj-panel { padding:12px; }
    /* 2.120: настройки объекта одним столбцом на мобильном */
    .op-grid { grid-template-columns:1fr; }
    .op-bed { grid-template-columns:1fr; }
    .op-grid input, .op-grid select { min-height:40px; }
    .op-extra { grid-template-columns:1fr; }
    .op-footer { flex-wrap:wrap; }
    .btn-rose { margin-left:0; width:100%; min-height:44px; }
    /* --- погода: панель в колонку, инпуты тянутся --- */
    .wx-bar { flex-direction:column; align-items:stretch; gap:8px; }
    .wx-bar > span { margin-left:0 !important; display:flex !important; flex-wrap:wrap; gap:6px; }
    [data-wx-place] { width:auto !important; flex:1 1 140px; min-height:40px; }
    [data-wx-lat], [data-wx-lon] { width:auto !important; flex:1 1 80px; min-height:40px; }
    .wx-btn { min-height:40px; padding:8px 12px; }
    .wx-btn[data-wx] { flex:1 1 40%; }
    /* --- календарь --- */
    .cal-mode-btn { min-height:40px; }
    .m-cell { min-height:52px; }
    .chat-root { height:60dvh; }
    /* --- аналитика --- */
    .an-kpi-value { font-size:26px; }
    .an-gantt-label { font-size:11px; }
    /* --- Цыпа и пузыри --- */
    #tsypa { max-width:170px; }
    #tsypa .tsypa-avatar img { width:44px; height:44px; }
    .tsypa-bubble { font-size:12.5px; padding:8px 10px; }
    #tsypa.pos-2, #tsypa.pos-3 { top:118px; }   /* шапка стала выше */
    .tip-bubble { top:118px; left:8px; right:8px; width:auto; }
    .toast { bottom:calc(80px + env(safe-area-inset-bottom)); width:max-content; max-width:calc(100vw - 24px); }
    /* --- нижнее меню во всю ширину --- */
    .bottomnav { left:0; right:0; transform:none; bottom:0; border-radius:0; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content:space-between; box-shadow:0 -6px 16px rgba(62,62,58,.10); }
    .nav-btn { flex:1; padding:8px 2px; font-size:11px; min-height:56px; }
    .nav-btn .ico { font-size:20px; }
    /* --- модалки: полноэкранные листы --- */
    .overlay { padding:0; }
    .modal { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); }
    .tutorial-modal { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; padding:14px 12px calc(14px + env(safe-area-inset-bottom)); }
    .tut-icon { font-size:44px; }
    .tut-title { font-size:24px; }
    .tut-gardener p { font-size:14px; }
    .tut-gardener-img { width:36px; height:36px; }
    .tut-tsypa-bubble { max-width:80%; font-size:15px; }
    .tut-tsypa-img { width:44px; height:44px; }
    /* --- Книга отзывов: полноэкранный лист --- */
    .calendar-modal { background:rgba(40,35,25,.6); }
    .calendar-stage { width:100vw; height:100dvh; aspect-ratio:auto; }
    .calendar-stage img { border-radius:0; }
    .gb-panel { left:10px; right:10px; top:10px; bottom:80px; transform:none; width:auto; max-height:none; }
    /* 2.116: выход из Книги — заметная пилюля с подписью, а не прозрачный кружок */
    .gb-close { left:10px; right:10px; top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); width:auto; height:52px; border-radius:999px; background:#5A4668; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; gap:8px; font:700 15px Manrope,sans-serif; color:#fff; }
    .gb-close::before { content:"✕"; font-size:18px; line-height:1; }
    .gb-close::after { content:"Закрыть книгу"; }
    /* --- шрифты инпутов 16px: iOS не zoom'ит при фокусе --- */
    input, select, textarea { font-size:16px !important; }

    /* --- 2.117: мобильный каркас --- */
    .m-only { display:flex; }
    #menuBtn { align-items:center; justify-content:center; min-width:48px; }
    .topbar-actions .btn:not(#menuBtn) { display:none; }   /* все действия шапки уходят в ☰-меню */
    .plants-sticker, .chat-sticker, .analytics-sticker, .cal-stickers { display:none; } /* стикеры не налезают на заголовки */
    .scheme-actions { display:none; }                      /* добавление через FAB, undo/redo плавающие */
    .m-fab { display:block; }
    .m-undoredo { display:flex; }
    /* компактная Цыпа: пузырь только по тапу, аватар 44px */
    #tsypa { max-width:170px; }
    #tsypa.tsypa-quiet .tsypa-bubble { display:none; }
    /* 2.118: карточка растения на мобильном — полноэкранный лист поверх всех слоёв */
    .plant-detail-overlay { padding:0; z-index:95; }
    .plant-detail-modal { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; padding:16px 14px calc(16px + env(safe-area-inset-bottom)); }
  }

  @media (max-width: 640px) {
    .logo { font-size:23px; }
    .logo-img { width:36px; height:36px; }
    .version { font-size:10px; padding:2px 8px; }
    .btn { padding:11px 12px; font-size:13px; }
    .screen-title { font-size:24px; }
    /* 2.120: один столбец настроек объекта */
    .op-grid { grid-template-columns:1fr; }
    .an-gantt-row, .an-gantt-axis { grid-template-columns:120px 1fr; }
    .an-gantt-label { font-size:10.5px; }
    .plants-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
    .plant-emoji { font-size:30px; }
    .gb-title { font-size:19px; }
    .gb-tab { padding:6px 10px; }
  }

  @media (max-width: 480px) {
    .logo { font-size:21px; }
    .logo-img { width:32px; height:32px; }
    .topbar-actions .btn { flex:1 1 auto; text-align:center; }
    .scheme-toolbar label { flex:1 1 100%; }
    .pal-btn { flex:1 1 46%; text-align:center; }
    .an-gantt-row, .an-gantt-axis { grid-template-columns:96px 1fr; }
    .an-kpi { padding:12px; }
    .an-kpi-value { font-size:23px; }
    .m-cell { min-height:46px; }
    .m-badge { font-size:10px; }
    /* 2.119: нижнее меню гарантированно помещается — «Аналитика» не обрезается */
    .bottomnav { gap:2px; padding:4px 2px calc(4px + env(safe-area-inset-bottom)); }
    .nav-btn { font-size:9.5px; padding:6px 1px; min-width:0; }
    .nav-btn .ico { font-size:18px; }
    .tut-title { font-size:22px; }
    .gb-panel { left:6px; right:6px; top:6px; bottom:80px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <!-- 2.105: логотип-блок со знаком бренда -->
    <div class="logo"><img src="assets/logo.svg" alt="Умный садовод — логотип" class="logo-img" /> Умный садовод <span class="version" id="appVersion"></span></div>
    <div class="topbar-actions">
      <!-- 2.117: мобильное меню (на дескменте скрыто) -->
      <button type="button" class="btn m-only" id="menuBtn" aria-label="Меню">☰</button>
      <button type="button" class="btn btn-blue" id="saveBtn">💾 Сохранить</button>
      <button type="button" class="btn btn-green" id="loadBtn">📂 Загрузить</button>
      <button type="button" class="btn btn-pink" id="resetBtn">🧹 Сбросить</button>
      <button type="button" class="btn" id="historyBtn" title="История ревизий">🕘 История</button>
      <!-- 2.86: обучение -->
      <button type="button" class="btn" id="tutorialBtn">🎓 Обучение</button>
      <!-- 2.101: Книга отзывов и предложений (было «Мой календарь») -->
      <button type="button" class="btn btn-violet" id="guestbookBtn">📖 Книга отзывов</button>
      <!-- 2.71/2.113: Цыпа в Советчике — векторный рисунок, относительный путь -->
      <button type="button" class="btn btn-olive advisor" id="advisorBtn">Советчик<img src="assets/chick.svg" alt="" class="advisor-emoji" /></button>
    </div>
  </header>

  <section class="screen active" id="screen-scheme">
    <div id="hintBar">
      <div class="hint-content">
        <button type="button" class="hint-pill" data-tip="Шаг 1 из 4: добавьте объект на участок"><span class="hint-step-number">1</span><span>🌿 Добавьте объект</span></button>
        <button type="button" class="hint-pill" data-tip="Шаг 2 из 4: перетащите объект на участке"><span class="hint-step-number">2</span><span>🖐 Перетащите его</span></button>
        <button type="button" class="hint-pill" data-tip="Шаг 3 из 4: кликните дважды по объекту, чтобы настроить его параметры"><span class="hint-step-number">3</span><span>⚙️ Кликните дважды, чтобы настроить</span></button>
        <button type="button" class="hint-pill" data-tip="Шаг 4 из 4: сохраните план в файл"><span class="hint-step-number">4</span><span>💾 Сохраните план в файл</span></button>
      </div>
      <button type="button" class="icon-btn" id="closeHintBtn" title="Скрыть подсказки">✕</button>
    </div>
    <div class="plot-name-bar">
      <span class="plot-name-emoji">🏡</span>
      <input id="plotNameInput" type="text" placeholder="Дайте имя вашему участку…" maxlength="60" />
    </div>
    <div class="scheme-toolbar">
      <label>Ширина, м <input id="plotW" type="number" min="4" max="60" value="12" /></label>
      <label>Длина, м <input id="plotL" type="number" min="4" max="60" value="8" /></label>
      <label>Сетка, м
        <select id="gridStep">
          <option value="0.1">0.1</option>
          <option value="0.25">0.25</option>
          <option value="0.5" selected>0.5</option>
          <option value="1">1</option>
        </select>
      </label>
      <label>Солнце
        <select id="sunDir">
          <option value="N">Север</option><option value="NW">Северо-Запад</option>
          <option value="W">Запад</option><option value="SW">Юго-Запад</option>
          <option value="S" selected>Юг</option><option value="SE">Юго-Восток</option>
          <option value="E">Восток</option><option value="NE">Северо-Восток</option>
        </select>
      </label>
      <!-- 2.96: Совместимость, 3D и Постер — в одном ряду с полями, прижаты вправо -->
      <div class="palette palette-right">
        <button type="button" class="pal-btn" id="compatBtn">🤝 Совместимость</button>
        <button type="button" class="pal-btn" id="isoBtn">3D</button>
        <button type="button" class="pal-btn" id="exportBtn">🖼 Постер PNG</button>
      </div>
    </div>
    <!-- 2.96: кнопки добавления объектов слева, Отменить/Повтор — вправо -->
    <div class="scheme-actions">
      <div class="palette palette-left">
        <button type="button" class="pal-btn" data-add="building">🏠 Постройка</button>
        <button type="button" class="pal-btn" data-add="greenhouse">🌱 Теплица</button>
        <button type="button" class="pal-btn" data-add="bed">🥕 Грядка</button>
        <button type="button" class="pal-btn" data-add="tree">🌳 Дерево</button>
        <button type="button" class="pal-btn" data-add="bush">🌵 Кустарник</button>
      </div>
      <div class="palette palette-right">
        <button type="button" class="pal-btn" id="undoBtn" title="Отменить (Ctrl+Z)" disabled>↩ Отменить</button>
        <button type="button" class="pal-btn" id="redoBtn" title="Повторить (Ctrl+Y или Ctrl+Shift+Z)" disabled>↪ Повтор</button>
      </div>
    </div>
    <div class="plot-wrap" id="plotWrap">
      <div id="plotBox">
        <div class="plot" id="plot"></div>
        <canvas id="shadeCanvas"></canvas>
        <div id="sunMarker">☀️</div>
      </div>
    </div>
    <div class="plot-wrap hidden" id="isoWrap" style="text-align:center">
      <canvas id="isoCanvas"></canvas>
    </div>
    <div class="obj-panel hidden" id="objPanel">
      <div class="op-grid">
        <label>Название <input id="opName" type="text" /></label>
        <label>X, м <input id="opX" type="number" step="0.1" /></label>
        <label>Y, м <input id="opY" type="number" step="0.1" /></label>
        <label>Ширина, м <input id="opW" type="number" step="0.1" min="0.3" /></label>
        <label>Длина, м <input id="opL" type="number" step="0.1" min="0.3" /></label>
        <label id="opHeightWrap">Высота, м <input id="opHeight" type="number" min="0.5" max="15" step="0.5" /></label>
        <label id="opCultureWrap">Культура <select id="opCulture"></select></label>
      </div>
      <div class="op-extra hidden" id="opExtra"></div>
      <div class="op-footer">
        <span class="obj-info" id="objInfo"></span>
        <button type="button" class="btn-rose" id="objDelete">🗑 Удалить</button>
      </div>
    </div>
    <div class="obj-list" id="objList"></div>
  </section>

  <section class="screen" id="screen-plants">
    <div style="position:relative">
      <!-- 2.113: относительный путь стикера -->
      <img src="stickers/chick.png" alt="" class="plants-sticker" />
      <h2 class="screen-title">Каталог <span class="accent">растений</span></h2>
      <div id="screen-plants-body"></div>
    </div>
  </section>

  <section class="screen" id="screen-calendar">
    <div style="position:relative">
      <div class="cal-stickers">
        <!-- 2.113: относительные пути стикеров -->
        <img src="stickers/watering.png" alt="" title="Полив" />
        <img src="stickers/apples.png" alt="" title="Урожай" />
        <img src="stickers/seedlings.png" alt="" title="Рассада" class="stickers-row2" />
      </div>
      <h2 class="screen-title">Календарь <span class="accent">по фазам</span></h2>
      <div id="screen-calendar-body"></div>
    </div>
  </section>

  <section class="screen" id="screen-chat">
    <div style="position:relative">
      <!-- 2.113: относительный путь стикера -->
      <img src="stickers/boy.png" alt="" class="chat-sticker" />
      <h2 class="screen-title">Чат <span class="accent">с садоводом</span></h2>
      <div id="chatRoot" class="chat-root"></div>
    </div>
  </section>

  <section class="screen" id="screen-home">
    <div class="an-plot-name" id="homePlotName"></div>
    <div id="screen-home-body"></div>
  </section>

  <section class="screen" id="screen-analytics">
    <div style="position:relative">
      <!-- 2.113: относительный путь стикера -->
      <img src="stickers/cat.png" alt="" class="analytics-sticker" />
      <h2 class="screen-title">Аналитика <span class="accent">сезона</span></h2>
      <div id="screen-analytics-body"></div>
    </div>
  </section>

  <nav class="bottomnav" id="bottomnav">
    <button type="button" class="nav-btn active" data-goto="screen-scheme"><span class="ico">🏡</span>Схема</button>
    <button type="button" class="nav-btn" data-goto="screen-plants"><span class="ico">🌱</span>Растения</button>
    <button type="button" class="nav-btn" data-goto="screen-calendar"><span class="ico">🗓</span>Календарь</button>
    <button type="button" class="nav-btn" data-goto="screen-chat"><span class="ico">💬</span>Чат</button>
    <!-- 2.87: иконка «Обзора» 📋 (была 🧺) -->
    <button type="button" class="nav-btn" data-goto="screen-home"><span class="ico">📋</span>Обзор</button>
    <button type="button" class="nav-btn" data-goto="screen-analytics"><span class="ico">📊</span>Аналитика</button>
  </nav>

  <!-- 2.101/2.102: Книга отзывов и предложений на фоне gb.png -->
  <div class="calendar-modal hidden" id="guestbookOverlay">
    <div class="calendar-stage" id="guestbookStage">
      <img id="guestbookBg" src="gb.png" alt="" onerror="this.parentNode.classList.add('no-image')" />
      <div class="gb-panel" id="gbPanel"></div>
      <button type="button" class="gb-close" id="gbClose" aria-label="Закрыть книгу"></button>
    </div>
  </div>

  <!-- 2.117: мобильное меню-лист -->
  <div class="m-sheet hidden" id="mMenuSheet">
    <div class="m-sheet-panel">
      <div class="m-sheet-head"><span class="m-sheet-title">Меню</span><button type="button" class="m-sheet-close" id="mMenuClose" aria-label="Закрыть">✕</button></div>
      <button type="button" class="m-item" data-mact="saveBtn"><span class="mi">💾</span>Сохранить</button>
      <button type="button" class="m-item" data-mact="loadBtn"><span class="mi">📂</span>Загрузить</button>
      <button type="button" class="m-item" data-mact="resetBtn"><span class="mi">🧹</span>Сбросить</button>
      <button type="button" class="m-item" data-mact="historyBtn"><span class="mi">🕘</span>История ревизий</button>
      <button type="button" class="m-item" data-mact="tutorialBtn"><span class="mi">🎓</span>Обучение</button>
      <button type="button" class="m-item" data-mact="guestbookBtn"><span class="mi">📖</span>Книга отзывов</button>
      <button type="button" class="m-item" data-mact="advisorBtn"><span class="mi">🐤</span>Советчик</button>
      <!-- 2.118: переключатель мобильной версии (выкл = эффект «Версии для ПК») -->
      <label class="m-switch"><span class="mi">📱</span>Мобильная версия<input type="checkbox" id="mobileModeToggle" checked /></label>
      <!-- 2.119: подсказка про браузерную галочку «Версия для ПК» -->
      <div class="m-note">Если в самом браузере включена «Версия для ПК», отключите её один раз в меню браузера (⋮).</div>
      <label class="m-switch"><span class="mi">🐤</span>Показывать Цыпу<input type="checkbox" id="tsypaToggle" checked /></label>
      <div style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:8px">Умный садовод · v<span id="mVersion"></span></div>
    </div>
  </div>
  <!-- 2.117: лист добавления объектов (мобильный) -->
  <div class="m-sheet hidden" id="mAddSheet">
    <div class="m-sheet-panel">
      <div class="m-sheet-head"><span class="m-sheet-title">Добавить на участок</span><button type="button" class="m-sheet-close" id="mAddClose" aria-label="Закрыть">✕</button></div>
      <button type="button" class="m-item" data-addfab="building"><span class="mi">🏠</span>Постройка</button>
      <button type="button" class="m-item" data-addfab="greenhouse"><span class="mi">🌱</span>Теплица</button>
      <button type="button" class="m-item" data-addfab="bed"><span class="mi">🥕</span>Грядка</button>
      <button type="button" class="m-item" data-addfab="tree"><span class="mi">🌳</span>Дерево</button>
      <button type="button" class="m-item" data-addfab="bush"><span class="mi">🌵</span>Кустарник</button>
    </div>
  </div>
  <button type="button" class="m-fab" id="addFab" aria-label="Добавить объект">+</button>
  <div class="m-undoredo" id="mUndoRedo">
    <button type="button" id="undoFab" disabled aria-label="Отменить">↩</button>
    <button type="button" id="redoFab" disabled aria-label="Повторить">↪</button>
  </div>

  <!-- 2.119: возврат в мобильную версию одним тапом (видна в ПК-режиме на тач-устройствах) -->
  <button type="button" class="fd-exit" id="fdExit">📱 Мобильная версия</button>

  <div class="tip-bubble hidden" id="tipBubble"></div>
  <div id="shadeTip" class="hidden"></div>
  <div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="overlay hidden" id="historyOverlay"><div class="modal" id="historyModal"></div></div>
  <div class="overlay hidden" id="compatOverlay"><div class="modal" id="compatModal"></div></div>
  <!-- 2.86: обучение -->
  <div class="overlay hidden" id="tutorialOverlay"><div class="modal tutorial-modal" id="tutorialModal"></div></div>
  <!-- 2.110: a11y — тост озвучивается скринридерами (role=status, aria-live=polite) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="planFile" accept=".json,application/json" hidden />
  <input type="file" id="plantsFile" accept=".json,application/json" hidden />

<script type="module" src="src/main.js"></script>
</body>
</html>
